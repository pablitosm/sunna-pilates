# ─────────────────────────────────────────────────────────────
#  TEXTOS DE LA HOME DE SUNNA (castellano)
#  Todos los textos salen del brief de SUNNA. Edita solo lo que está
#  entre comillas y respeta los espacios del principio de cada línea.
#  Las líneas que empiezan por # son notas y no se ven en la web.
# ─────────────────────────────────────────────────────────────

# Título y descripción para Google y al compartir el enlace.
seo:
  titulo: "SUNNA · Pilates reformer en Santa Cruz de Tenerife"
  descripcion: "Pilates reformer en Santa Cruz de Tenerife. Entrenas cuando quieres, a tu ritmo, con una clase guiada en pantalla, y nunca empiezas sola/o: la primera vez te lo enseñamos todo."

# Textos pequeños de la interfaz (lectores de pantalla, pie, selector de idioma…).
ui:
  idioma: "Idioma"
  saltar: "Saltar al contenido"
  irInicio: "SUNNA, ir al inicio"
  navegacion: "Principal"
  abrirMenu: "Abrir menú"
  menu: "Menú"
  paso: "Paso"
  porMes: "/mes"
  mapaTitulo: "Mapa: ubicación de SUNNA"
  pieEstudio: "Estudio"
  pieContacto: "Contacto"
  pieLegal: "Legal"

# Menú: Cómo funciona · Precios · Preguntas + botón fijo.
menu:
  - texto: "Cómo funciona"
    ancla: "como-funciona"
  - texto: "Precios"
    ancla: "precios"
  - texto: "Preguntas"
    ancla: "preguntas"

# El botón principal cambia según el "estado" de ajustes.yaml.
botones:
  principal:
    preapertura: "Quiero ser socio/a fundador/a"
    abierto: "Reserva tu primera sesión gratis"
  # Botón fijo del menú y de la barra del móvil.
  principalCorto:
    preapertura: "Quiero ser socio/a fundador/a"
    abierto: "Primera sesión gratis"
  secundario: "Cómo funciona"

# Enlaces a bsport (se muestran solo si el enlace está en ajustes.yaml → reservas).
enlaces:
  horarios: "Ver horarios"
  membresias: "Comprar membresías"
  app: "Descargar la app"

# 1 · PORTADA
portada:
  titular: "Pilates reformer a tu hora."
  subtitulo: "Tu reformer, tu clase en pantalla y el estudio para ti. La primera vez, te lo enseñamos todo."
  # Antes de abrir se muestra la fecha de apertura (ajustes.yaml → fechaApertura) cuando esté cerrada.
  abrimos: "abrimos el"
  # Foto opcional (foto real del estudio o de alguien en el reformer con luz natural).
  # Para añadirla: guárdala en src/assets/fotos/ y quita las # de estas líneas.
  # foto:
  #   imagen: "../../assets/fotos/portada.jpg"
  #   alt: "El estudio de SUNNA con luz natural"

# 2 · QUÉ ES SUNNA (3 ideas en una fila)
# Iconos disponibles: arco, anillo, pantalla, linea, punto, hoja, rectangulo
queEs:
  titulo: "Qué es SUNNA"
  ideas:
    - icono: "anillo"
      titulo: "Tú eliges la hora"
      texto: "Reservas en la app, sin horarios fijos de grupo."
    - icono: "pantalla"
      titulo: "Una clase guiada en tu reformer"
      texto: "iPad en cada máquina con clases de 10 a 45 min."
    - icono: "arco"
      titulo: "Nunca empiezas sola/o"
      texto: "Primera sesión de 45 min con nosotros."

# 3 · CÓMO FUNCIONA, EN 4 PASOS (el bloque más importante)
comoFunciona:
  titulo: "Cómo funciona"
  pasos:
    - icono: "arco"
      titulo: "Ven a tu primera sesión. Es gratis."
      texto: "45 minutos con nosotros: te enseñamos el reformer, la app, cómo entrar y cómo elegir tu clase. Es obligatoria antes de entrenar por tu cuenta."
    - icono: "anillo"
      titulo: "Reserva tu reformer en la app."
      texto: "Eliges día y hora. Esa hora el reformer es tuyo."
    - icono: "pantalla"
      titulo: "Entra con el móvil."
      texto: "La puerta se abre con tu reserva. Sin llaves ni recepción."
    - icono: "punto"
      titulo: "Elige tu clase y dale al play."
      texto: "En el iPad de tu reformer: full body, core, pierna, movilidad… de 10 a 45 minutos."
  notaFinal: "Al terminar, deja tu reformer listo para la siguiente persona."
  # PENDIENTE: confirmar antes de publicar. Los plazos exactos se cierran con bsport (sin cifras).
  datos:
    reserva: "Cada reserva es un bloque de 1 hora: hasta 50 min de clase + tiempo para entrar, colocar y salir."
    cancelacion: "Se reserva con antelación y se cancela sin coste hasta cierto plazo antes."
    horario:
      titulo: "Horario"
      fases:
        - etiqueta: "Las 2–3 primeras semanas"
          horas: ["08:00 — 14:00", "16:00 — 22:00"]
          texto: "El estudio solo abre con alguien de SUNNA dentro."
        - etiqueta: "Después"
          horas: ["05:00 — 23:00"]
          texto: "Acceso autónomo."

# 4 · LAS CLASES
clases:
  titulo: "Las clases"
  tiposTitulo: "Tipos"
  tipos: ["Full Body", "Pierna", "Brazo", "Core", "Movilidad", "Estiramientos"]
  duraciones:
    - nombre: "Largas"
      minutos: "40–45"
    - nombre: "Cortas"
      minutos: "15–25"
    - nombre: "Movilidad"
      minutos: "10–15"
  idiomas: ["Castellano", "Inglés", "Alemán", "Francés"]
  idiomasTexto: "El catálogo más grande es en inglés, pero hay clases de sobra en castellano."
  cascos: "Cada reformer tiene cascos de diadema bluetooth. Si lo prefieres, trae los tuyos."

# 5 · RECOVERY + LOS TRES ESPACIOS (reformer, sauna y sala de luz roja)
# Sin promesas de salud: describe qué es y cómo se usa, nunca qué "cura" o "mejora".
recovery:
  etiqueta: "Recovery"
  titulo: "Reformer, sauna y luz roja."
  lineas:
    - "Sauna y luz roja entran en la apertura."
    - "Incluidas en tu membresía, según el plan."
  # Título de la tablita de cada apartado (qué incluye cada membresía).
  membresiaTitulo: "En tu membresía"
  # BORRADOR: los textos de los tres apartados están pendientes de revisión por SUNNA.
  # "pendiente" muestra un aviso [PENDIENTE] en la web; déjalo en "" para quitarlo.
  # Para poner una foto real en un apartado, añade debajo de "pendiente":
  #     foto:
  #       imagen: "../../assets/fotos/sauna.jpg"
  #       alt: "Descripción de la foto"
  apartados:
    - tipo: "reformer"
      titulo: "El reformer"
      texto: "Una máquina de Pilates con un carro que se desliza sobre raíles, muelles y correas. Los muelles marcan la resistencia, así que se ajusta a ti, tanto si empiezas de cero como si no."
      puntos:
        - "6 reformers, una persona por máquina."
        - "iPad con tu clase y cascos bluetooth en cada reformer."
        - "En tu primera sesión te enseñamos a usarlo con seguridad."
      membresia:
        - plan: "Basic"
          cantidad: "4 al mes"
        - plan: "Standard"
          cantidad: "8 al mes"
        - plan: "Pro"
          cantidad: "12 al mes"
        - plan: "Premium"
          cantidad: "Ilimitado"
      pendiente: ""
    - tipo: "sauna"
      titulo: "La sauna"
      texto: "Una sauna de infrarrojos: en lugar de calentar mucho el aire, calienta con luz infrarroja, así que el ambiente es más suave que el de una sauna tradicional."
      puntos:
        - "Entra en la apertura."
        - "Se reserva en la app, igual que tu reformer."
        - "Incluida desde la membresía Standard."
      membresia:
        - plan: "Basic"
          cantidad: "No incluida"
        - plan: "Standard"
          cantidad: "1 al mes"
        - plan: "Pro"
          cantidad: "2 al mes"
        - plan: "Premium"
          cantidad: "Ilimitada"
      # PENDIENTE: duración de cada sesión y qué llevar.
      pendiente: "[PENDIENTE] duración de cada sesión y qué llevar"
    - tipo: "luz-roja"
      titulo: "La sala de luz roja"
      texto: "Una sala con paneles de luz roja. Te colocas frente a ellos, te relajas y dejas que pase la sesión."
      puntos:
        - "Entra en la apertura."
        - "Se reserva en la app, igual que tu reformer."
        - "Incluida en todas las membresías."
      membresia:
        - plan: "Basic"
          cantidad: "1 al mes"
        - plan: "Standard"
          cantidad: "2 al mes"
        - plan: "Pro"
          cantidad: "3 al mes"
        - plan: "Premium"
          cantidad: "Ilimitada"
      # PENDIENTE: duración de cada sesión y qué llevar.
      pendiente: "[PENDIENTE] duración de cada sesión y qué llevar"

# 6 · ¿Y SI…? — dudas en una línea
dudas:
  titulo: "¿Y si…?"
  items:
    - pregunta: "¿Nunca has hecho Pilates?"
      respuesta: "La primera sesión es para eso."
    - pregunta: "¿Y si me pierdo en la clase?"
      respuesta: "El vídeo te guía paso a paso y puedes pausar."
    - pregunta: "¿Estaré sola en el estudio?"
      respuesta: "Al principio siempre habrá alguien de SUNNA. Después, solo entra quien ha reservado, con cámaras y teléfono de ayuda."
    - pregunta: "¿Llegas tarde siempre?"
      respuesta: "Aquí no hay “tarde”: tu clase empieza cuando le das al play."

