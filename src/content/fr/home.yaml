      texto: "Première séance de 45 min avec nous."

# 3 · CÓMO FUNCIONA
comoFunciona:
  titulo: "Comment ça marche"
  pasos:
    - icono: "arco"
      titulo: "Viens à ta première séance. C'est gratuit."
      texto: "45 minutes avec nous : on te montre le reformer, l'app, comment entrer et comment choisir ton cours. Elle est obligatoire avant de t'entraîner en autonomie."
    - icono: "anillo"
      titulo: "Réserve ton reformer dans l'app."
      texto: "Tu choisis le jour et l'heure. Pendant cette heure, le reformer est à toi."
    - icono: "pantalla"
      titulo: "Entre avec ton téléphone."
      texto: "La porte s'ouvre avec ta réservation. Sans clés ni accueil."
    - icono: "punto"
      titulo: "Choisis ton cours et appuie sur play."
      texto: "Sur l'iPad de ton reformer : full body, core, jambes, mobilité… de 10 à 45 minutes."
  notaFinal: "À la fin, laisse ton reformer prêt pour la personne suivante."
  datos:
    reserva: "Chaque réservation est un créneau d'1 heure : jusqu'à 50 min de cours + le temps d'entrer, de t'installer et de repartir."
    cancelacion: "Tu réserves à l'avance et tu peux annuler sans frais jusqu'à un certain délai avant."
    horario:
      titulo: "Horaires"
      fases:
        - etiqueta: "Les 2–3 premières semaines"
          horas: ["08:00 — 14:00", "16:00 — 22:00"]
          texto: "Le studio n'ouvre qu'avec quelqu'un de SUNNA sur place."
        - etiqueta: "Ensuite"
          horas: ["05:00 — 23:00"]
          texto: "Accès en autonomie."

