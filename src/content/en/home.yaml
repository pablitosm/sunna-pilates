# 1 · PORTADA
portada:
  titular: "Reformer Pilates on your *time*."
  subtitulo: "Your reformer, your class on screen and the studio to yourself. The first time, we show you everything."
  abrimos: "opening on"
  foto:
    imagen: "../../assets/portada.png"
    alt: "The SUNNA studio: reformers, curtains and warm light"

porQue:
  titulo: "Why SUNNA"
  intro: "Train whenever you want, at your own pace, with a class guided on screen. And you never start alone: the first time, we show you everything."
  razones:
    - titulo: "Open morning and afternoon"
      texto: "08:00–14:00 and 16:00–22:00. No group timetable: you book the hour that suits you."
      # Con ajustes.yaml → horario: ampliado se muestra esto en su lugar.
      ampliado:
        titulo: "Open 05:00 to 23:00"
        texto: "With no reception desk and no group timetable, the studio opens far longer hours."
    - titulo: "Everything runs on its own"
      texto: "Book your reformer in the app and the door opens with your booking. No keys, no reception, no waiting."
    - titulo: "Your class, your pace"
      texto: "An iPad and headphones on every reformer: pick a class from 10 to 45 min and press play. For that hour, the reformer is yours."
  app:
    titulo: "Your key is the *app*"
    texto: "Book your reformer, pay and open the studio door with it. No app, no entry: download it before you come."
    pasos:
      - "Download the SUNNA app."
      - "Book your free first session."
      - "Come to the studio and get in with your phone."
    # Paso 2 mientras quedan plazas de socio fundador (enlaza a la oferta de fundadores).
    pasoFundador: "Become a founding member."
    proximamente: "Coming soon"
    appStore: "App Store"
    googlePlay: "Google Play"

explora:
  titulo: "Discover SUNNA"
  ver: "See"
  precios:
    titulo: "Pricing"
    texto: "Four monthly memberships, from €55 a month."

primeraSesion:
  titulo: "Your first session is *free*."
  texto: "45 minutes with us before you train on your own. It's required, and it's free."
  incluyeTitulo: "What we do in those 45 minutes"
  incluye:
    - "We show you the reformer and how to use it safely."
    - "We set up the app with you: booking and cancelling."
    - "We explain how to get into the studio with your phone."
    - "We show you how to pick your class on the iPad and press play."
  reservarTitulo: "Book it"
  reservarTexto: "In the app, on the web or by messaging us on WhatsApp: your choice."
  web: "Book on the web"
  whatsapp: "Book on WhatsApp"
  whatsappMensaje: "Hi, I'd like to book my free first session at SUNNA Pilates."

# 2 · QUÉ ES SUNNA
queEs:
  titulo: "What SUNNA is"
  ideas:
    - icono: "anillo"
      titulo: "You choose the time"
      texto: "Book in the app, no fixed group timetable."
    - icono: "pantalla"
      titulo: "A guided class on your reformer"
      texto: "An iPad on every machine with classes from 10 to 45 min."
    - icono: "arco"
      titulo: "You never start alone"
      texto: "A 45-min first session with us."

# 3 · CÓMO FUNCIONA
comoFunciona:
  titulo: "How it works"
  pasos:
    - icono: "arco"
      titulo: "Come to your first session. It's free."
      texto: "45 minutes with us: we show you the reformer, the app, how to get in and how to choose your class. It's required before you train on your own."
    # Reservar y entrar van en un solo paso: los dos son «desde el móvil».
    - icono: "pantalla"
      titulo: "Book in the app and get in with your phone."
      texto: "Pick a day and time: for that hour, the reformer is yours. The door opens with your booking, no keys, no reception."
    - icono: "punto"
      titulo: "Choose your class and press play."
      texto: "On your reformer's iPad: full body, core, legs, mobility… from 10 to 45 minutes."
  notaFinal: "When you finish, leave your reformer ready for the next person."
  datos:
    reserva: "Each booking is a 1-hour block: up to 50 min of class + time to come in, set up and leave."
    cancelacion: "You book in advance and cancellation is free up to 2 hours before."
    horario:
      titulo: "Opening hours"
      fases:
        - fase: "inicial"
          intro: "We open in two blocks while we validate the self-service model."
          etiqueta: "The first 2–3 weeks"
          horas: ["08:00 — 14:00", "16:00 — 22:00"]
          texto: "The studio only opens with someone from SUNNA inside."
        - fase: "ampliado"
          horas: ["05:00 — 23:00"]
          texto: "Self-service access."
      # "Cómo se llena el día" (franjas de demanda) se quita hasta tener estadísticas reales.
      # El componente lo sigue admitiendo: basta con volver a añadir "franjas:" aquí.

