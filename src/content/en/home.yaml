# 9 · PREGUNTAS FRECUENTES
faq:
  titulo: "Frequently asked questions"
  contacto:
    titulo: "Still have questions?"
    texto: "Drop us a line and we'll be happy to help."
  grupos:
    - titulo: "Getting started"
      preguntas:
        - pregunta: "Do I need to know Pilates?"
          respuesta: "No. The first session, free and with us, is designed for complete beginners."
        - pregunta: "What happens in the first session?"
          respuesta: "45 minutes in which we show you the reformer, the app, how to get into the studio and how to choose a class. You can't train on your own without it."
        - pregunta: "What if I forget something later?"
          respuesta: "Message us on WhatsApp or come by when someone from the team is in and we'll go over it."
    - titulo: "Booking and getting in"
      preguntas:
        - pregunta: "How do I book?"
          respuesta: "In the SUNNA app (bsport). Pick a day, time and reformer."
        - pregunta: "How do I get in?"
          respuesta: "With your phone: the door only opens if you have a booking at that time."
        - pregunta: "Can I cancel?"
          respuesta: "Yes, cancellation is free up to 2 hours before."
        - pregunta: "What are your opening hours?"
          respuesta: "08:00–14:00 and 16:00–22:00, always with someone from the team in the studio."
          # Con ajustes.yaml → horario: ampliado se muestra esta respuesta.
          respuestaAmpliado: "05:00–23:00, with self-service access."
    - titulo: "The classes"
      preguntas:
        - pregunta: "What is a class like?"
          respuesta: "You choose on your reformer's iPad and follow the video. There are classes from 10 to 45 minutes: full body, core, legs, arms, mobility and stretching."
        - pregunta: "In what language?"
          respuesta: "In Spanish, English, German and French. The largest catalogue is in English, and there are plenty of classes in Spanish too."
        - pregunta: "Do I need headphones?"
          respuesta: "No. Every reformer has bluetooth over-ear headphones. If you prefer, bring your own."
        - pregunta: "What should I bring?"
          respuesta: ""
    - titulo: "Safety and membership"
      preguntas:
        - pregunta: "Is it safe to train without an instructor?"
          respuesta: "Before training on your own you do the introductory session. Only people with a booking can get in, there are cameras in the studio and you have a help phone and WhatsApp to talk to us directly."
        - pregunta: "Can I cancel my membership?"
          respuesta: "Yes, with 10 days' notice."
        - pregunta: "Is there a minimum age?"
          respuesta: "18 to train alone. Minors from 16, accompanied by an adult."

