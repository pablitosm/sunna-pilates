# 2 · QUÉ ES SUNNA
queEs:
  titulo: "SUNNA, c'est quoi"
  ideas:
    - icono: "anillo"
      titulo: "Tu choisis l'heure"
      texto: "Tu réserves dans l'app, sans horaires de groupe fixes."
    - icono: "pantalla"
