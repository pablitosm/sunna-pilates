# 6 · ¿Y SI…?
dudas:
  titulo: "What if…?"
  items:
    - pregunta: "Never done Pilates?"
      respuesta: "That's what the first session is for."
    - pregunta: "What if I get lost in the class?"
      respuesta: "The video guides you step by step and you can pause it."
    - pregunta: "Will I be alone in the studio?"
      respuesta: "At first there will always be someone from SUNNA. After that, only people with a booking can get in, with cameras and a help phone."
    - pregunta: "Always running late?"
      respuesta: "There's no “late” here: your class starts when you press play."

