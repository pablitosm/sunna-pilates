# 1 · PORTADA
portada:
  titular: "Reformer Pilates, wann es dir *passt*."
  subtitulo: "Dein Reformer, deine Klasse auf dem Bildschirm und das Studio für dich. Beim ersten Mal zeigen wir dir alles."
  abrimos: "Eröffnung am"
  foto:
    imagen: "../../assets/portada.png"
    alt: "Das SUNNA-Studio: Reformer, Vorhänge und warmes Licht"

porQue:
  titulo: "Warum SUNNA"
  razones:
    - titulo: "Morgens und nachmittags geöffnet"
      texto: "{horario}. Keine festen Gruppenzeiten: Du buchst die Stunde, die dir passt."
      # Con ajustes.yaml → horario: ampliado se muestra esto en su lugar.
      ampliado:
        titulo: "Geöffnet {horario}"
        texto: "Ohne Empfang und ohne feste Gruppenzeiten ist das Studio viel länger geöffnet."
    - titulo: "Alles läuft autonom"
      texto: "Du buchst deinen Reformer in der App, und die Tür öffnet sich mit deiner Buchung. Keine Schlüssel, kein Empfang, kein Warten."
    - titulo: "Deine Klasse, dein Tempo"
      texto: "iPad und Kopfhörer an jedem Reformer: Wähle eine Klasse von 10 bis 45 Min. und drück auf Play. In dieser Stunde gehört der Reformer dir."
  app:
    titulo: "Dein Schlüssel ist die *App*"
    texto: "Damit buchst du deinen Reformer, bezahlst und öffnest die Studiotür. Ohne App kein Zutritt: Lade sie herunter, bevor du kommst."
    proximamente: "Demnächst"
    appStore: "App Store"
    googlePlay: "Google Play"

explora:
  titulo: "SUNNA entdecken"
  ver: "Ansehen"
  precios:
    texto: "Vier Monatsmitgliedschaften, ab 55 € im Monat."

primeraSesion:
  titulo: "Deine erste Session ist *gratis*."
  texto: "45 Minuten mit uns, bevor du allein trainierst. Sie ist Pflicht – und kostenlos."
  incluyeTitulo: "Was wir in diesen 45 Minuten machen"
  incluye:
    - "Wir zeigen dir den Reformer und wie du ihn sicher benutzt."
    - "Wir richten mit dir die App ein: buchen und stornieren."
    - "Wir erklären dir, wie du mit dem Handy ins Studio kommst."
    - "Wir zeigen dir, wie du deine Klasse auf dem iPad wählst und auf Play drückst."
  reservarTitulo: "Buche sie"
  reservarTexto: "In der App, im Web oder per WhatsApp – wie du willst."
  web: "Im Web buchen"
  whatsapp: "Per WhatsApp buchen"
  whatsappMensaje: "Hallo, ich möchte meine kostenlose erste Session bei SUNNA Pilates buchen."

# 3 · CÓMO FUNCIONA
comoFunciona:
  titulo: "So funktioniert's"
  pasos:
    - icono: "arco"
      titulo: "Komm zu deiner ersten Session. Sie ist gratis."
      texto: "45 Minuten mit uns: Wir zeigen dir den Reformer, die App, wie du reinkommst und wie du deine Klasse auswählst. Sie ist Pflicht, bevor du allein trainierst."
    # Reservar y entrar van en un solo paso: los dos son «desde el móvil».
    - icono: "pantalla"
      titulo: "Buche in der App und komm mit dem Handy rein."
      texto: "Du wählst Tag und Uhrzeit: In dieser Stunde gehört der Reformer dir. Die Tür öffnet sich mit deiner Buchung, ohne Schlüssel und ohne Rezeption."
    - icono: "punto"
      titulo: "Wähl deine Klasse und drück auf Play."
      texto: "Auf dem iPad deines Reformers: Full Body, Core, Beine, Mobilität … von 10 bis 45 Minuten."
  notaFinal: "Wenn du fertig bist, lass deinen Reformer bereit für die nächste Person."
  datos:
    reserva: "Jede Buchung ist ein Block von 1 Stunde: bis zu 50 Min. Klasse + Zeit zum Ankommen, Einstellen und Gehen."
    cancelacion: "Du buchst im Voraus und kannst bis 2 Stunden vorher kostenlos stornieren."
    horario:
      titulo: "Öffnungszeiten"
      fases:
        - fase: "inicial"
        - fase: "ampliado"
          texto: "Selbstständiger Zugang."
      # "Cómo se llena el día" (franjas de demanda) se quita hasta tener estadísticas reales.
      # El componente lo sigue admitiendo: basta con volver a añadir "franjas:" aquí.

