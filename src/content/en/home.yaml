      titulo: "The reformer"
      texto: "A Pilates machine with a carriage that slides on rails, springs and straps. The springs set the resistance, so it adapts to you, whether you're starting from zero or not."
      puntos:
        - "6 reformers, one person per machine."
        - "An iPad with your class and bluetooth headphones on every reformer."
        - "In your first session we show you how to use it safely."
