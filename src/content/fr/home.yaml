# 1 · PORTADA
portada:
  titular: "Le Pilates Reformer à ton *heure*."
  subtitulo: "Ton reformer, ton cours à l'écran et le studio pour toi. La première fois, on te montre tout."
  abrimos: "ouverture le"
  foto:
    imagen: "../../assets/portada.png"
    alt: "Le studio SUNNA : reformers, rideaux et lumière chaude"

porQue:
  titulo: "Pourquoi SUNNA"
  razones:
    - titulo: "Ouvert matin et après-midi"
      texto: "{horario}. Pas d'horaires de groupe : tu réserves l'heure qui te convient."
      # Con ajustes.yaml → horario: ampliado se muestra esto en su lugar.
      ampliado:
        titulo: "Ouvert {horario}"
        texto: "Sans accueil ni horaires de groupe, le studio ouvre bien plus longtemps."
    - titulo: "Tout est autonome"
      texto: "Tu réserves ton reformer dans l'app et la porte s'ouvre avec ta réservation. Pas de clés, pas d'accueil, pas d'attente."
    - titulo: "Ton cours, à ton rythme"
      texto: "Un iPad et un casque sur chaque reformer : choisis un cours de 10 à 45 min et appuie sur play. Pendant cette heure, le reformer est à toi."
  app:
    titulo: "Ta clé, c'est l'*app*"
    texto: "Avec elle, tu réserves ton reformer, tu paies et tu ouvres la porte du studio. Sans l'app, pas d'accès : télécharge-la avant de venir."
    proximamente: "Bientôt disponible"
    appStore: "App Store"
    googlePlay: "Google Play"

explora:
  titulo: "Découvrir SUNNA"
  ver: "Voir"
  precios:
    texto: "Quatre abonnements mensuels, à partir de 55 € par mois."

primeraSesion:
  titulo: "Ta première séance est *gratuite*."
  texto: "45 minutes avec nous avant de t'entraîner en autonomie. Elle est obligatoire."
  incluyeTitulo: "Ce qu'on fait pendant ces 45 minutes"
  incluye:
    - minutos: 20
      titulo: "Le reformer"
      texto: "On te montre le reformer et comment l'utiliser en toute sécurité."
    - minutos: 10
      titulo: "L'app"
      texto: "On configure l'app avec toi : réserver et annuler."
    - minutos: 5
      titulo: "L'entrée"
      texto: "On t'explique comment entrer au studio avec ton téléphone."
    - minutos: 10
      titulo: "L'iPad"
      texto: "On te montre comment choisir ton cours sur l'iPad."
  cierre: "Et voilà : à partir de là, tu t'entraînes en autonomie."
  reservarTitulo: "Réserve-la"
  reservarTexto: "Dans l'app, sur le web ou en nous écrivant sur WhatsApp : c'est toi qui choisis."
  web: "Réserver sur le web"
  whatsapp: "Réserver sur WhatsApp"
  whatsappMensaje: "Bonjour, je voudrais réserver ma première séance gratuite chez SUNNA Pilates."

# 3 · CÓMO FUNCIONA
comoFunciona:
  titulo: "Comment ça marche"
  pasos:
    - icono: "arco"
      titulo: "Viens à ta première séance. C'est gratuit."
      texto: "45 minutes avec nous : on te montre le reformer, l'app, comment entrer et comment choisir ton cours. Elle est obligatoire avant de t'entraîner en autonomie."
    # Reservar y entrar van en un solo paso: los dos son «desde el móvil».
    - icono: "pantalla"
      titulo: "Réserve dans l'app et entre avec ton téléphone."
      texto: "Tu choisis le jour et l'heure : pendant cette heure, le reformer est à toi. La porte s'ouvre avec ta réservation, sans clés ni accueil."
    - icono: "punto"
      titulo: "Choisis ton cours et appuie sur play."
      texto: "Sur l'iPad de ton reformer : full body, core, jambes, mobilité… de 10 à 45 minutes."
  notaFinal: "À la fin, laisse ton reformer prêt pour la personne suivante."
  datos:
    reserva: "Chaque réservation est un créneau d'1 heure : jusqu'à 50 min de cours + le temps d'entrer, de t'installer et de repartir."
    cancelacion: "Tu réserves à l'avance et l'annulation est gratuite jusqu'à 2 heures avant."
    horario:
      titulo: "Horaires"
      fases:
        - fase: "inicial"
        - fase: "ampliado"
          texto: "Accès en autonomie."
      # "Cómo se llena el día" (franjas de demanda) se quita hasta tener estadísticas reales.
      # El componente lo sigue admitiendo: basta con volver a añadir "franjas:" aquí.

# 4 · LAS CLASES
clases:
  titulo: "Les *cours*"
  tipos: ["Full Body", "Jambes", "Bras", "Core", "Mobilité", "Étirements"]
  duraciones:
    - nombre: "Longs"
      minutos: "40–45"
    - nombre: "Courts"
      minutos: "15–25"
    - nombre: "Mobilité"
      minutos: "10–15"
  idiomas: ["Espagnol", "Anglais", "Allemand", "Français"]
  idiomasTexto: "Le plus grand catalogue est en anglais, mais il y a aussi largement de quoi faire en espagnol."
  cascos: "Chaque reformer a un casque bluetooth. Si tu préfères, apporte le tien."

# 5 · RECOVERY
recovery:
  etiqueta: "Recovery"
  titulo: "Reformer, sauna et *lumière rouge*."
  lineas:
    - "Le sauna et la lumière rouge sont là dès l'ouverture."
    - "Inclus dans ton abonnement, selon la formule."
  membresiaTitulo: "Dans ton abonnement"
  apartados:
    - tipo: "reformer"
      titulo: "Le reformer"
      texto: "Une machine de Pilates avec un chariot qui glisse sur des rails, des ressorts et des sangles. Les ressorts règlent la résistance : il s'adapte à toi, que tu partes de zéro ou non."
      puntos:
        - "6 reformers, une personne par machine."
        - "Un iPad avec ton cours et un casque bluetooth sur chaque reformer."
        - "Lors de ta première séance, on te montre comment l'utiliser en toute sécurité."
      membresia:
        - plan: "Basic"
          cantidad: "4 par mois"
        - plan: "Standard"
          cantidad: "8 par mois"
        - plan: "Pro"
          cantidad: "12 par mois"
        - plan: "Premium"
          cantidad: "Illimité"
      pendiente: ""
    - tipo: "sauna"
      titulo: "Le sauna"
      texto: "Un sauna infrarouge : au lieu de beaucoup chauffer l'air, il réchauffe avec la lumière infrarouge, donc l'ambiance est plus douce que dans un sauna traditionnel."
      puntos:
        - "Là dès l'ouverture."
        - "Se réserve dans l'app, comme ton reformer."
        - "Inclus à partir de l'abonnement Standard."
      membresia:
        - plan: "Basic"
          cantidad: "Non inclus"
        - plan: "Standard"
          cantidad: "1 par semaine"
        - plan: "Pro"
          cantidad: "2 par semaine"
        - plan: "Premium"
          cantidad: "Illimité"
      pendiente: ""
    - tipo: "luz-roja"
      titulo: "La salle de lumière rouge"
      texto: "Une salle avec des panneaux de lumière rouge. Tu te places devant, tu te détends et tu laisses la séance se dérouler."
      puntos:
        - "Là dès l'ouverture."
        - "Se réserve dans l'app, comme ton reformer."
        - "Incluse dans tous les abonnements."
      membresia:
        - plan: "Basic"
          cantidad: "1 par semaine"
        - plan: "Standard"
          cantidad: "2 par semaine"
        - plan: "Pro"
          cantidad: "3 par semaine"
        - plan: "Premium"
          cantidad: "Illimité"
      pendiente: ""

# 6 · ¿Y SI…?
dudas:
  titulo: "Et si… ?"
  items:
    - pregunta: "Jamais fait de Pilates ?"
      respuesta: "C'est justement le but de la première séance."
    - pregunta: "Et si je suis perdu·e pendant le cours ?"
      respuesta: "La vidéo te guide pas à pas et tu peux mettre en pause."
    - pregunta: "Serai-je seul·e au studio ?"
      respuesta: "Au début, il y aura toujours quelqu'un de SUNNA. Ensuite, seules les personnes qui ont réservé peuvent entrer, avec caméras et téléphone d'assistance."
    - pregunta: "Toujours en retard ?"
      respuesta: "Ici, pas de « retard » : ton cours commence quand tu appuies sur play."

