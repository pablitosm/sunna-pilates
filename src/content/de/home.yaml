# 9 · PREGUNTAS FRECUENTES
faq:
  titulo: "Häufige Fragen"
  contacto:
    titulo: "Noch Fragen?"
    texto: "Schreib uns, wir helfen dir gern weiter."
  grupos:
    - titulo: "Anfangen"
      preguntas:
        - pregunta: "Muss ich Pilates können?"
          respuesta: "Nein. Die erste Session, gratis und mit uns, ist für alle gedacht, die bei null anfangen."
        - pregunta: "Was passiert in der ersten Session?"
          respuesta: "45 Minuten, in denen wir dir den Reformer, die App, den Zugang zum Studio und die Auswahl der Klasse zeigen. Ohne sie kannst du nicht allein trainieren."
        - pregunta: "Und wenn ich später etwas vergesse?"
          respuesta: "Schreib uns auf WhatsApp oder komm vorbei, wenn jemand vom Team da ist, und wir gehen es noch einmal durch."
    - titulo: "Buchen und reinkommen"
      preguntas:
        - pregunta: "Wie buche ich?"
          respuesta: "In der SUNNA-App (bsport). Du wählst Tag, Uhrzeit und Reformer."
        - pregunta: "Wie komme ich rein?"
          respuesta: "Mit dem Handy: Die Tür öffnet sich nur, wenn du zu diesem Zeitpunkt eine Buchung hast."
        - pregunta: "Kann ich stornieren?"
          respuesta: "Ja, bis 2 Stunden vorher kannst du kostenlos stornieren."
        - pregunta: "Welche Öffnungszeiten habt ihr?"
          respuesta: "{horario}, immer mit jemandem vom Team im Studio."
          # Con ajustes.yaml → horario: ampliado se muestra esta respuesta.
          respuestaAmpliado: "{horario}, mit autonomem Zugang."
    - titulo: "Die Klassen"
      preguntas:
        - pregunta: "Wie läuft eine Klasse ab?"
          respuesta: "Du wählst auf dem iPad deines Reformers und folgst dem Video. Es gibt Klassen von 10 bis 45 Minuten: Full Body, Core, Beine, Arme, Mobilität und Dehnen."
        - pregunta: "In welcher Sprache?"
          respuesta: "Auf Spanisch, Englisch, Deutsch und Französisch. Das größte Angebot gibt es auf Englisch, aber auch auf Spanisch gibt es reichlich Klassen."
        - pregunta: "Brauche ich Kopfhörer?"
          respuesta: "Nein. Jeder Reformer hat Bluetooth-Over-Ear-Kopfhörer. Wenn du möchtest, bring deine eigenen mit."
        - pregunta: "Was muss ich mitbringen?"
          respuesta: ""
    - titulo: "Sicherheit und Mitgliedschaft"
      preguntas:
        - pregunta: "Ist es sicher, ohne Trainer:in zu trainieren?"
          respuesta: "Bevor du allein trainierst, machst du die Einführungssession. Nur wer gebucht hat, kommt rein, im Studio gibt es Kameras, und du hast ein Hilfetelefon und WhatsApp, um direkt mit uns zu sprechen."
        - pregunta: "Kann ich kündigen?"
          respuesta: "Ja, mit 10 Tagen Vorlauf."
        - pregunta: "Gibt es ein Mindestalter?"
          respuesta: "18 Jahre, um allein zu trainieren. Minderjährige ab 16 Jahren in Begleitung eines Erwachsenen."

