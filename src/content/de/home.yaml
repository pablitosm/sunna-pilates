# 6 · ¿Y SI…?
dudas:
  titulo: "Und wenn …?"
  items:
    - pregunta: "Noch nie Pilates gemacht?"
      respuesta: "Genau dafür ist die erste Session da."
    - pregunta: "Und wenn ich in der Klasse nicht mitkomme?"
      respuesta: "Das Video führt dich Schritt für Schritt, und du kannst jederzeit pausieren."
    - pregunta: "Bin ich allein im Studio?"
      respuesta: "Am Anfang ist immer jemand von SUNNA da. Danach kommt nur rein, wer gebucht hat – mit Kameras und Hilfetelefon."
    - pregunta: "Immer zu spät?"
      respuesta: "Hier gibt es kein „zu spät“: Deine Klasse beginnt, wenn du auf Play drückst."

