document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle><style>\nbody{margin:0;background:#EDE4D8;font-family:\"DM Sans\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#8C3A12;text-decoration-thickness:1px;text-underline-offset:3px}\na:hover{color:#FF8235}\n@keyframes breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.06);opacity:1}}\n@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}\n<\u002Fstyle><\u002Fhelmet>\n\n<section id=\"t2\" style=\"padding:44px 48px 40px;border-bottom:1px solid rgba(59,29,14,.12)\">\n<div style=\"display:flex;align-items:baseline;gap:12px;margin:0 0 8px\">\n<a href=\"#t2\" style=\"font:500 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#3B1D0E;color:#FDF6EE;border-radius:5px;text-decoration:none\">2<\u002Fa>\n<span style=\"font:500 14px/1.2 'DM Sans',sans-serif;color:#3B1D0E\">Cómo funciona y Precios como páginas completas, con tu contenido real<\u002Fspan>\n<\u002Fdiv>\n<p style=\"max-width:860px;margin:0 0 28px;font:400 13px/1.6 'DM Sans',sans-serif;color:#7A5540;text-wrap:pretty\">Escrito con lo que me has dado, sin inventar nada. Recovery se describe solo por lo que es: sin efectos, sin la palabra «tratamiento», sin bañera de hielo. En Precios muestro las cuatro membresías (la home sigue mostrando tres) y Socios Fundadores como bloque motor, con hueco para el contador real de plazas. Bonos, clases sueltas y Starter Pack no aparecen: siguen en fase 2 y el «no quiero membresía» está sin respuesta cerrada. <b style=\"font-weight:500\">Pendiente tú:<\u002Fb> fecha de apertura, plazas restantes y si el Starter Pack entra o no en la apertura.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start\">\n\n<div id=\"2a\" style=\"display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:10px;font:400 12px/1.3 'DM Sans',sans-serif;color:#7A5540\"><a href=\"#2a\" style=\"font:500 10.5px ui-monospace,monospace;padding:3px 7px;background:rgba(59,29,14,.09);color:#3B1D0E;border-radius:5px;text-decoration:none\">2a<\u002Fa>Página · Cómo funciona · desktop 1440 · acento verde en la franja tranquila<\u002Fdiv>\n\n<div style=\"width:1440px;position:relative;background:#FDF6EE;border:1px solid rgba(59,29,14,.10);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(59,29,14,.14)\">\n<div style=\"position:absolute;inset:0;pointer-events:none;z-index:60;opacity:0.035;mix-blend-mode:multiply;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27160%27%20height=%27160%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.85%27%20numOctaves=%272%27/%3E%3C/filter%3E%3Crect%20width=%27160%27%20height=%27160%27%20filter=%27url%28%23n%29%27/%3E%3C/svg%3E)\"><\u002Fdiv>\n\n<div style=\"position:relative;padding:16px 0 0\">\n<div style=\"display:flex;justify-content:center\">\n<div style=\"width:1360px;display:flex;align-items:center;gap:32px;padding:12px 14px 12px 26px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,241,230,.30));backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.65);border-radius:999px;box-shadow:0 24px 60px rgba(59,29,14,.10),inset 0 1px 0 rgba(255,255,255,.90),inset 0 -1px 0 rgba(255,130,53,.20)\">\n<img src=\"5bb8039c-027d-442a-9455-510d96f4c78e\" alt=\"sunna\" style=\"height:26px;display:block\">\n<nav style=\"display:flex;gap:26px;margin-left:14px;font:400 15px 'DM Sans',sans-serif\">\n<a href=\"#2a\" style=\"color:#3B1D0E;text-decoration:none;border-bottom:1.5px solid #FF8235;padding-bottom:2px\">Cómo funciona<\u002Fa>\n<a href=\"#2a\" style=\"color:#7A5540;text-decoration:none\">Clases<\u002Fa>\n<a href=\"#2a\" style=\"color:#7A5540;text-decoration:none\">El estudio<\u002Fa>\n<a href=\"#2b\" style=\"color:#7A5540;text-decoration:none\">Precios<\u002Fa>\n<a href=\"#2a\" style=\"color:#7A5540;text-decoration:none\">Sobre nosotras<\u002Fa>\n<\u002Fnav>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,241,230,.7);font:400 13px 'DM Sans',sans-serif\">\n<span style=\"padding:6px 12px;border-radius:999px;background:#FF8235;color:#3B1D0E;font-weight:500\">ES<\u002Fspan>\n<span style=\"padding:6px 12px;border-radius:999px;color:#7A5540\">EN<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;background:#FF8235;border-radius:999px;padding:0 4px 0 22px;height:48px;box-shadow:0 10px 30px rgba(255,130,53,.28)\" style-hover=\"background:#FFA76B\">\n<span style=\"font:400 15px 'DM Sans',sans-serif;color:#3B1D0E;white-space:nowrap\">Reserva tu clase de prueba gratis<\u002Fspan>\n<div style=\"width:52px;height:52px;margin-left:14px;border-radius:999px;background:#FF8235;box-shadow:inset 0 0 0 1px rgba(59,29,14,.10);display:flex;align-items:center;justify-content:center\"><span style=\"font:400 18px 'DM Sans',sans-serif;color:#3B1D0E\">→<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;padding:96px 140px 80px\">\n<div style=\"position:absolute;left:50%;top:-180px;width:1100px;height:700px;margin-left:-550px;pointer-events:none;background:radial-gradient(closest-side,rgba(255,130,53,.30) 0%,rgba(255,196,154,.16) 50%,rgba(253,246,238,0) 100%)\"><\u002Fdiv>\n<div style=\"position:relative;max-width:960px\">\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540;margin-bottom:26px\">Cómo funciona<\u002Fdiv>\n<h1 style=\"margin:0 0 24px;font:400 78px/1.03 'DM Sans',sans-serif;letter-spacing:-.025em;color:#3B1D0E;text-wrap:pretty\">La primera vez<br>vienes con nosotras.<\u002Fh1>\n<p style=\"margin:0;max-width:58ch;font:400 20px/1.6 'DM Sans',sans-serif;color:#3B1D0E;text-wrap:pretty\">Después el estudio es tuyo: reservas desde la app, la puerta se abre con tu reserva y eliges la clase en el iPad de tu estación.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 140px 120px\">\n<div style=\"display:flex;flex-direction:column\">\n\n<div style=\"display:grid;grid-template-columns:104px 1fr 460px;gap:40px;align-items:start;padding:44px 0;border-top:1px solid rgba(59,29,14,.14)\">\n<div style=\"font:400 44px/1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#D95E1E\">01<\u002Fdiv>\n<div>\n<h2 style=\"margin:0 0 14px;font:400 40px/1.1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#3B1D0E\">Reservas tu hora.<\u002Fh2>\n<p style=\"margin:0;max-width:44ch;font:400 18px/1.6 'DM Sans',sans-serif;color:#3B1D0E;text-wrap:pretty\">Desde la app de bsport. Reservas hasta cuatro días antes y cancelas hasta dos horas antes sin coste.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;justify-content:space-between;gap:16px;padding:16px 20px;border-radius:14px;background:#FFF1E6;font:400 15px 'DM Sans',sans-serif;color:#3B1D0E\"><span style=\"color:#7A5540\">Reserva<\u002Fspan><span>hasta 4 días antes<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;padding:16px 20px;border-radius:14px;background:#FFF1E6;font:400 15px 'DM Sans',sans-serif;color:#3B1D0E\"><span style=\"color:#7A5540\">Cancelación<\u002Fspan><span>hasta 2 h antes, sin coste<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;padding:16px 20px;border-radius:14px;background:#FFF1E6;font:400 15px 'DM Sans',sans-serif;color:#3B1D0E\"><span style=\"color:#7A5540\">Dónde<\u002Fspan><span>app de bsport<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:104px 1fr 460px;gap:40px;align-items:start;padding:44px 0;border-top:1px solid rgba(59,29,14,.14)\">\n<div style=\"font:400 44px/1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#D95E1E\">02<\u002Fdiv>\n<div>\n<h2 style=\"margin:0 0 14px;font:400 40px/1.1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#3B1D0E\">Tu primera clase es gratis, y no vienes sola.<\u002Fh2>\n<p style=\"margin:0;max-width:44ch;font:400 18px/1.6 'DM Sans',sans-serif;color:#3B1D0E;text-wrap:pretty\">Cuarenta y cinco minutos con nosotras: te enseñamos la máquina, cómo se reserva y cómo funciona el estudio.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:26px 28px;border-radius:28px;background:#8C3A12;color:#FDF6EE\">\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,246,238,.7);margin-bottom:16px\">Onboarding<\u002Fdiv>\n<div style=\"font:400 34px/1.1 'DM Sans',sans-serif;letter-spacing:-.02em;margin-bottom:12px\">45 min · gratis<\u002Fdiv>\n<p style=\"margin:0;font:400 15px/1.6 'DM Sans',sans-serif;color:rgba(253,246,238,.88);text-wrap:pretty\">Máquina, reserva y estudio. Sin compromiso de compra después.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:104px 1fr 460px;gap:40px;align-items:start;padding:44px 0;border-top:1px solid rgba(59,29,14,.14)\">\n<div style=\"font:400 44px/1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#D95E1E\">03<\u002Fdiv>\n<div>\n<h2 style=\"margin:0 0 14px;font:400 40px/1.1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#3B1D0E\">Después, entras tú sola.<\u002Fh2>\n<p style=\"margin:0;max-width:44ch;font:400 18px/1.6 'DM Sans',sans-serif;color:#3B1D0E;text-wrap:pretty\">Llave móvil en el teléfono: la puerta se abre porque tienes reserva. Cada estación tiene su reformer y su iPad con las clases.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<div style=\"padding:22px;border-radius:14px;background:#FFF1E6\"><div style=\"width:34px;height:34px;border-radius:999px;border:1.5px solid #D95E1E;margin-bottom:16px\"><\u002Fdiv><div style=\"font:400 17px/1.35 'DM Sans',sans-serif;color:#3B1D0E\">Llave móvil<\u002Fdiv><div style=\"font:400 14px/1.5 'DM Sans',sans-serif;color:#7A5540\">Se activa con tu reserva<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:22px;border-radius:14px;background:#FFF1E6\"><div style=\"width:34px;height:26px;border-radius:5px;border:1.5px solid #D95E1E;margin-bottom:24px\"><\u002Fdiv><div style=\"font:400 17px/1.35 'DM Sans',sans-serif;color:#3B1D0E\">iPad por estación<\u002Fdiv><div style=\"font:400 14px/1.5 'DM Sans',sans-serif;color:#7A5540\">Eliges y reproduces la clase<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:104px 1fr 460px;gap:40px;align-items:start;padding:44px 0;border-top:1px solid rgba(59,29,14,.14);border-bottom:1px solid rgba(59,29,14,.14)\">\n<div style=\"font:400 44px/1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#D95E1E\">04<\u002Fdiv>\n<div>\n<h2 style=\"margin:0 0 14px;font:400 40px/1.1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#3B1D0E\">Terminas a tu ritmo.<\u002Fh2>\n<p style=\"margin:0;max-width:44ch;font:400 18px/1.6 'DM Sans',sans-serif;color:#3B1D0E;text-wrap:pretty\">Sauna de infrarrojos y luz roja si tu plan las incluye. Dejas la estación lista y te vas.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"padding:16px 20px;border-radius:14px;background:#FFF1E6;font:400 15px/1.55 'DM Sans',sans-serif;color:#3B1D0E\">Sauna seca de infrarrojos y sala de luz roja, separadas por cortina.<\u002Fdiv>\n<div style=\"padding:16px 20px;border-radius:14px;background:#FFF1E6;font:400 15px/1.55 'DM Sans',sans-serif;color:#3B1D0E\">Incluidas según plan. Consulta lo que incluye el tuyo en <a href=\"#2b\" style=\"color:#8C3A12\">Precios<\u002Fa>.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#F8EDE0;padding:110px 140px\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:56px\">\n<h2 style=\"margin:0;font:400 56px/1.06 'DM Sans',sans-serif;letter-spacing:-.02em;color:#3B1D0E\">Las clases<\u002Fh2>\n<span style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540\">50 minutos · 6 plazas<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px\">\n<div style=\"background:#FFF1E6;border-radius:28px;padding:34px 30px 38px\">\n<div style=\"font:400 56px/1 'DM Sans',sans-serif;letter-spacing:-.025em;color:#3B1D0E;margin-bottom:18px\">50′<\u002Fdiv>\n<h3 style=\"margin:0 0 10px;font:400 24px/1.2 'DM Sans',sans-serif;color:#3B1D0E\">de clase<\u002Fh3>\n<p style=\"margin:0;font:400 16px/1.6 'DM Sans',sans-serif;color:#7A5540;text-wrap:pretty\">Más diez de rotación y limpieza: el bloque que reservas es de sesenta.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FFF1E6;border-radius:28px;padding:34px 30px 38px\">\n<div style=\"display:flex;gap:6px;margin-bottom:26px\">\n<div style=\"width:20px;height:44px;border-radius:6px;background:#FF8235\"><\u002Fdiv><div style=\"width:20px;height:44px;border-radius:6px;background:#FF8235\"><\u002Fdiv><div style=\"width:20px;height:44px;border-radius:6px;background:#FF8235\"><\u002Fdiv><div style=\"width:20px;height:44px;border-radius:6px;background:#FFC49A\"><\u002Fdiv><div style=\"width:20px;height:44px;border-radius:6px;background:#FFC49A\"><\u002Fdiv><div style=\"width:20px;height:44px;border-radius:6px;background:#FFC49A\"><\u002Fdiv>\n<\u002Fdiv>\n<h3 style=\"margin:0 0 10px;font:400 24px/1.2 'DM Sans',sans-serif;color:#3B1D0E\">6 plazas, 6 reformers<\u002Fh3>\n<p style=\"margin:0;font:400 16px/1.6 'DM Sans',sans-serif;color:#7A5540;text-wrap:pretty\">Una plaza por máquina. Nunca compartes reformer ni esperas turno.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FFF1E6;border-radius:28px;padding:34px 30px 38px\">\n<div style=\"display:flex;gap:8px;margin-bottom:26px;font:400 13px 'DM Sans',sans-serif\"><span style=\"padding:8px 14px;border-radius:999px;background:#FDF6EE;color:#3B1D0E\">Castellano<\u002Fspan><span style=\"padding:8px 14px;border-radius:999px;background:#FDF6EE;color:#3B1D0E\">English<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 10px;font:400 24px/1.2 'DM Sans',sans-serif;color:#3B1D0E\">Biblioteca en dos idiomas<\u002Fh3>\n<p style=\"margin:0;font:400 16px/1.6 'DM Sans',sans-serif;color:#7A5540;text-wrap:pretty\">En castellano y, cuando corresponda, en inglés.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#FFF1E6;border-radius:28px;padding:34px 36px 38px\">\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540;margin-bottom:22px\">Tipos de clase<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;font:400 19px 'DM Sans',sans-serif\">\n<span style=\"padding:12px 22px;border-radius:999px;background:#FDF6EE;color:#3B1D0E\">Full Body<\u002Fspan>\n<span style=\"padding:12px 22px;border-radius:999px;background:#FDF6EE;color:#3B1D0E\">Pierna<\u002Fspan>\n<span style=\"padding:12px 22px;border-radius:999px;background:#FDF6EE;color:#3B1D0E\">Brazo<\u002Fspan>\n<span style=\"padding:12px 22px;border-radius:999px;background:#FDF6EE;color:#3B1D0E\">Core<\u002Fspan>\n<span style=\"padding:12px 22px;border-radius:999px;background:#FDF6EE;color:#3B1D0E\">Movilidad<\u002Fspan>\n<span style=\"padding:12px 22px;border-radius:999px;background:#FDF6EE;color:#3B1D0E\">Estiramientos<\u002Fspan>\n<span style=\"padding:12px 22px;border-radius:999px;background:#FF8235;color:#3B1D0E\">Onboarding<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:110px 140px\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px\">\n<h2 style=\"margin:0;font:400 56px/1.06 'DM Sans',sans-serif;letter-spacing:-.02em;color:#3B1D0E\">El horario<\u002Fh2>\n<span style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540\">Fase inicial<\u002Fspan>\n<\u002Fdiv>\n<p style=\"max-width:56ch;margin:0 0 48px;font:400 18px/1.6 'DM Sans',sans-serif;color:#7A5540;text-wrap:pretty\">Abrimos en dos tramos mientras validamos la operación autónoma. Cuando esté validada, el estudio pasa a 05:00–23:00.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px\">\n<div style=\"border-radius:28px;background:#FFF1E6;padding:34px 36px 38px\">\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540;margin-bottom:20px\">Ahora<\u002Fdiv>\n<div style=\"font:400 40px/1.1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#3B1D0E\">08:00 — 14:00<\u002Fdiv>\n<div style=\"font:400 40px/1.1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#3B1D0E;margin-top:6px\">16:00 — 22:00<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius:28px;background:#FDF6EE;border:1px dashed rgba(217,94,30,.45);padding:34px 36px 38px\">\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540;margin-bottom:20px\">Modelo final<\u002Fdiv>\n<div style=\"font:400 40px/1.1 'DM Sans',sans-serif;letter-spacing:-.02em;color:#D95E1E\">05:00 — 23:00<\u002Fdiv>\n<p style=\"margin:14px 0 0;font:400 15px/1.6 'DM Sans',sans-serif;color:#7A5540;text-wrap:pretty\">Cuando la operación autónoma esté validada.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-radius:28px;background:#F8EDE0;padding:38px 36px 40px\">\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540;margin-bottom:26px\">Cómo se llena el día<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n<div style=\"background:#FFF1E6;border-radius:14px;padding:24px 26px 26px\"><div style=\"font:400 26px/1.1 'DM Sans',sans-serif;color:#3B1D0E\">07:00 — 09:00<\u002Fdiv><div style=\"margin-top:12px;font:400 15px/1.55 'DM Sans',sans-serif;color:#7A5540\">Franja más demandada. Antes del trabajo.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#9DAF7C;border-radius:14px;padding:24px 26px 26px\"><div style=\"font:400 26px/1.1 'DM Sans',sans-serif;color:#26350F\">12:00 — 15:00<\u002Fdiv><div style=\"margin-top:12px;font:400 15px/1.55 'DM Sans',sans-serif;color:#26350F\">La franja tranquila. A mediodía el estudio es casi tuyo.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#FFF1E6;border-radius:14px;padding:24px 26px 26px\"><div style=\"font:400 26px/1.1 'DM Sans',sans-serif;color:#3B1D0E\">18:00 — 21:00<\u002Fdiv><div style=\"margin-top:12px;font:400 15px/1.55 'DM Sans',sans-serif;color:#7A5540\">Franja más demandada. Para cerrar el día.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#3B1D0E;padding:110px 140px;color:#FDF6EE\">\n<div style=\"display:grid;grid-template-columns:1fr 520px;gap:80px;align-items:start\">\n<div>\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,246,238,.62);margin-bottom:26px\">Recovery<\u002Fdiv>\n<h2 style=\"margin:0 0 22px;font:400 56px/1.06 'DM Sans',sans-serif;letter-spacing:-.02em\">Sauna de infrarrojos y luz roja.<\u002Fh2>\n<p style=\"margin:0 0 18px;max-width:44ch;font:400 19px/1.6 'DM Sans',sans-serif;color:rgba(253,246,238,.9);text-wrap:pretty\">Una sauna seca de infrarrojos y una sala de luz roja, separadas por una cortina. Las dos están dentro de la apertura.<\u002Fp>\n<p style=\"margin:0;max-width:44ch;font:400 17px/1.6 'DM Sans',sans-serif;color:rgba(253,246,238,.7);text-wrap:pretty\">El acceso depende de tu plan: cuántas sesiones incluye cada uno está en <a href=\"#2b\" style=\"color:#FFA76B\">Precios<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"border-radius:28px;overflow:hidden;height:200px;background-image:url(&quot;fe44c281-42e6-47de-9a3e-4ea3ea289081&quot;);background-size:cover;background-position:60% 45%;filter:grayscale(1) sepia(.9) saturate(1.35) hue-rotate(-8deg) brightness(.9)\"><\u002Fdiv>\n<div style=\"padding:20px 24px;border-radius:14px;border:1px solid rgba(253,246,238,.22);font:400 13px/1.7 'DM Sans',sans-serif;color:rgba(253,246,238,.72);text-wrap:pretty\">SUNNA no es un centro sanitario (CNAE 9313). La sauna y la luz roja se describen por lo que son: instalaciones del estudio. No prometemos ningún efecto sobre la salud.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:110px 140px 120px;text-align:center\">\n<h2 style=\"margin:0 0 20px;font:400 64px/1.06 'DM Sans',sans-serif;letter-spacing:-.025em;color:#3B1D0E\">La primera es gratis.<\u002Fh2>\n<p style=\"margin:0 auto 40px;max-width:48ch;font:400 19px/1.6 'DM Sans',sans-serif;color:#7A5540;text-wrap:pretty\">Cuarenta y cinco minutos contigo, sin compromiso de compra después.<\u002Fp>\n<div style=\"display:inline-flex;align-items:center;background:#FF8235;border-radius:999px;padding:0 6px 0 34px;height:64px;box-shadow:0 18px 44px rgba(255,130,53,.34)\" style-hover=\"background:#FFA76B\">\n<span style=\"font:400 19px 'DM Sans',sans-serif;color:#3B1D0E;white-space:nowrap\">Reserva tu clase de prueba gratis<\u002Fspan>\n<div style=\"width:70px;height:70px;margin-left:20px;border-radius:999px;background:#FF8235;box-shadow:inset 0 0 0 1px rgba(59,29,14,.10);display:flex;align-items:center;justify-content:center\"><span style=\"font:400 24px 'DM Sans',sans-serif;color:#3B1D0E\">→<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font:400 14px/1.6 'DM Sans',sans-serif;color:#8C3A12\">Aún no hemos abierto: el botón te guarda sitio en la lista de apertura.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:#8C3A12;padding:56px 140px;display:flex;align-items:center;justify-content:space-between;gap:60px\">\n<img src=\"b5fb7cbc-34b1-4204-a6ba-2b5be6535891\" alt=\"sunna\" style=\"height:44px\">\n<span style=\"font:400 13px/1.6 'DM Sans',sans-serif;color:rgba(253,246,238,.72)\">Santa Cruz de Tenerife · abrimos [POR CONFIRMAR]<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<di if;letter-spacing:-.025em;color:#3B1D0E;text-wrap:pretty\">Una cuota,<br>y el estudio es tuyo.<\u002Fh1>\n<p style=\"margin:0;max-width:54ch;font:400 20px/1.6 'DM Sans',sans-serif;color:#3B1D0E;text-wrap:pretty\">Membresías mensuales con sesiones de reformer y recovery incluido. Sin permanencia salvo en el plan de fundadoras.<\u002Fp>\n<\u002Fdiv>\n<div style=\"text-align:right;font:400 14px/1.6 'DM Sans',sans-serif;color:#7A5540\">Todos los precios<br>con IVA incluido.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 140px 110px\">\n<div style=\"display:flex;align-items:center;gap:26px;margin-bottom:40px;padding:22px 30px;border-radius:999px;background:#FFF1E6\">\n<span style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540;white-space:nowrap\">Primero<\u002Fspan>\n<span style=\"font:400 22px/1.3 'DM Sans',sans-serif;color:#3B1D0E\">Tu primera clase es gratis. Eliges plan después de probar, no antes.<\u002Fspan>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;background:#FF8235;border-radius:999px;padding:0 4px 0 24px;height:52px;box-shadow:0 12px 32px rgba(255,130,53,.30)\" style-hover=\"background:#FFA76B\">\n<span style=\"font:400 16px 'DM Sans',sans-serif;color:#3B1D0E;white-space:nowrap\">Reserva tu clase de prueba gratis<\u002Fspan>\n<div style=\"width:56px;height:56px;margin-left:16px;border-radius:999px;background:#FF8235;box-shadow:inset 0 0 0 1px rgba(59,29,14,.10);display:flex;align-items:center;justify-content:center\"><span style=\"font:400 19px 'DM Sans',sans-serif;color:#3B1D0E\">→<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start\">\n\n<div style=\"background:#FFF1E6;border-radius:28px;padding:34px 30px 34px;display:flex;flex-direction:column;gap:22px;min-height:420px\">\n<div>\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540;margin-bottom:18px\">Basic<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font:400 52px/1 'DM Sans',sans-serif;letter-spacing:-.03em;color:#3B1D0E\">65 €<\u002Fspan><span style=\"font:400 16px 'DM Sans',sans-serif;color:#7A5540\">/mes<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.5 'DM Sans',sans-serif;color:#3B1D0E\">\n<div style=\"display:flex;gap:12px\"><span style=\"color:#D95E1E\">—<\u002Fspan><span>1 sesión por semana <span style=\"color:#7A5540\">(4 al mes)<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px\"><span style=\"color:#D95E1E\">—<\u002Fspan><span>1 luz roja por semana <span style=\"color:#7A5540\">(sin sauna)<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"text-align:center;padding:14px;border-radius:999px;border:1.5px solid #3B1D0E;font:400 16px 'DM Sans',sans-serif;color:#3B1D0E\" style-hover=\"background:#3B1D0E;color:#FDF6EE\">Probar gratis y luego Basic<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;background:#3B1D0E;border-radius:28px;padding:34px 30px 34px;display:flex;flex-direction:column;gap:22px;min-height:460px;box-shadow:0 24px 60px rgba(59,29,14,.22)\">\n<div style=\"position:absolute;left:30px;top:-13px;padding:6px 14px;border-radius:999px;background:#FF8235;font:500 12px 'DM Sans',sans-serif;color:#3B1D0E\">Recomendada<\u002Fdiv>\n<div>\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,246,238,.65);margin-bottom:18px\">Standard<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font:400 52px/1 'DM Sans',sans-serif;letter-spacing:-.03em;color:#FDF6EE\">119 €<\u002Fspan><span style=\"font:400 16px 'DM Sans',sans-serif;color:rgba(253,246,238,.65)\">/mes<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;font: px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,130,53,.2)\"><\u002Fdiv><div style=\"position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:999px;background:#FF8235\"><\u002Fdiv><\u002Fdiv><span style=\"font:400 11px ui-monospace,monospace;color:#7A5540\">reposo · 8 + 32<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;align-items:center\"><div style=\"position:relative;width:96px;height:96px;border-radius:14px;background:radial-gradient(closest-side at 50% 50%,rgba(255,196,154,.5),rgba(253,246,238,.9));display:flex;align-items:center;justify-content:center\"><div style=\"width:56px;height:56px;border-radius:999px;background:rgba(255,130,53,.15);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)\"><\u002Fdiv><div style=\"position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:999px;background:#FF8235\"><\u002Fdiv><\u002Fdiv><span style=\"font:400 11px ui-monospace,monospace;color:#7A5540\">enlace · 56<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;align-items:center\"><div style=\"position:relative;width:118px;height:118px;border-radius:14px;overflow:hidden;background:#F8EDE0;display:flex;align-items:center;justify-content:center\"><img src=\"70f5b744-e82a-412a-870c-bc12a6731ebd\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\"><div style=\"position:relative;width:96px;height:96px;border-radius:999px;background:rgba(255,241,230,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font:400 14px 'DM Sans',sans-serif;color:#3B1D0E\">ver<\u002Fdiv><\u002Fdiv><span style=\"font:400 11px ui-monospace,monospace;color:#7A5540\">foto · 96 «ver»<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;align-items:center\"><div style=\"position:relative;width:180px;height:96px;border-radius:14px;background:radial-gradient(closest-side at 50% 50%,rgba(255,130,53,.5),rgba(253,246,238,.9));display:flex;align-items:center;justify-content:center\"><div style=\"padding:14px 26px;border-radius:999px;background:rgba(255,130,53,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.65);font:400 15px 'DM Sans',sans-serif;color:#3B1D0E\">reservar<\u002Fdiv><\u002Fdiv><span style=\"font:400 11px ui-monospace,monospace;color:#7A5540\">CTA · píldora «reservar»<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;align-items:center\"><div style=\"width:96px;height:96px;border-radius:14px;background:#FFF1E6;display:flex;align-items:center;justify-content:center;font:400 26px 'DM Sans',sans-serif;color:#3B1D0E\">I<\u002Fdiv><span style=\"font:400 11px ui-monospace,monospace;color:#7A5540\">texto · barra del sistema<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<div style=\"font:400 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A5540;margin-bottom:24px\">Logotipo · qué sí y qué no<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n<div style=\"border-radius:14px;background:#FDF6EE;border:1px solid rgba(59,29,14,.12);padding:26px;display:flex;flex-direction:column;gap:16px;justify-content:space-between\"><img src=\"5bb8039c-027d-442a-9455-510d96f4c78e\" alt=\"sunna\" style=\"width:100%\"><span style=\"font:400 12px/1.5 ui-monospace,monospace;color:#7A5540\">SÍ · tinta #3B1D0E sobre fondos claros. Área de respeto = altura de la «S».<\u002Fspan><\u002Fdiv>\n<div style=\"border-radius:14px;background:radial-gradient(closest-side at 40% 50%,#FF8235,#FFC49A);padding:26px;display:flex;flex-direction:column;gap:16px;justify-content:space-between\"><img src=\"b5fb7cbc-34b1-4204-a6ba-2b5be6535891\" alt=\"sunna\" style=\"width:100%\"><span style=\"font:400 12px/1.5 ui-monospace,monospace;color:#3B1D0E\">SÍ · crema sobre el halo o sobre foto, solo en zonas limpias.<\u002Fspan><\u002Fdiv>\n<div style=\"border-radius:14px;background:#8C3A12;padding:26px;display:flex;flex-direction:column;gap:16px;justify-content:space-between\"><img src=\"b5fb7cbc-34b1-4204-a6ba-2b5be6535891\" alt=\"sunna\" style=\"width:100%\"><span style=\"font:400 12px/1.5 ui-monospace,monospace;color:rgba(253,246,238,.85)\">SÍ · firma de footer, de lado a lado, crema sobre Naranja 900.<\u002Fspan><\u002Fdiv>\n<div style=\"border-radius:14px;background:#FFF1E6;padding:26px;display:flex;flex-direction:column;gap:14px;justify-content:space-between\"><div style=\"display:flex;gap:12px;align-items:center\"><div style=\"width:52px;height:52px;border-radius:999px;background:#FF8235;display:flex;align-items:center;justify-content:center;overflow:hidden\"><img src=\"b5fb7cbc-34b1-4204-a6ba-2b5be6535891\" alt=\"s\" style=\"width:180px;margin-left:-8px\"><\u002Fdiv><div style=\"height:56px;flex:1;border-radius:14px;border:1px dashed rgba(217,94,30,.5);display:flex;align-items:center;justify-content:center;font:400 10px ui-monospace,monospace;color:#7A5540;text-align:center\">[PENDIENTE]<br>lockup con descriptor<\u002Fdiv><\u002Fdiv><span style=\"font:400 12px/1.5 ui-monospace,monospace;color:#7A5540\">Favicon: la «S» aislada, crema sobre Naranja 500 · recorte por confirmar. Mínimo en pantalla: 110 px de ancho.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;padding:16px 20px;border-radius:14px;background:#FFE0C9;font:400 14px/1.7 'DM Sans',sans-serif;color:#3B1D0E\">Nunca: dentro de una caja de color · repetido como patrón · animado letra a letra · con vidrio encima · deformado, con sombra, contorno o degradado · sobre una cara o un reformer · junto a logos de terceros en su color corporativo.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p style=\"margin:30px 0 0;font:400 12px/1.5 'DM Sans',sans-serif;color:#7A5540\">Siguiente: «más aire en el hero» · «prueba el acento verde en «Qué hay dentro»» · «enséñame Cómo funciona y Precios como páginas»<\u002Fp>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;liveCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Lámina&quot;},&quot;grain&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3.5,&quot;min&quot;:0,&quot;max&quot;:8,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Lámina&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;verde&quot;,&quot;gris azulado&quot;,&quot;ninguno&quot;],&quot;default&quot;:&quot;ninguno&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lámina&quot;}}\">\nconst DICT = {\n  nav1:\"How it works\", nav2:\"Classes\", nav3:\"The studio\", nav4:\"Prices\", nav5:\"About us\",\n  cta:\"Book your free trial class\", kicker:\"Santa Cruz de Tenerife · opening\",\n  h1:\"Reformer pilates,\\non your hour.\",\n  hsub:\"Six reformers and the room to yourself. Book your hour in the app, let yourself in with it and pick the class you feel like that day.\",\n  hfine:\"No membership. No lock-in. 50 minutes.\",\n  hpre:\"We haven't opened yet: the button saves you a place on the opening list.\",\n  h2how:\"How it works\",\n  s1t:\"You book your reformer.\", s1b:\"Pick your time and machine in the app. No calls, no waiting list, no front desk.\",\n  s2t:\"You let yourself in.\", s2b:\"The door opens with your booking. You arrive, change, and go to the reformer you booked.\",\n  s3t:\"You pick your class.\", s3b:\"On the iPad at your reformer you choose the session you feel like today. Intensity, pace and cues on screen.\",\n  s4t:\"You finish at your pace.\", s4b:\"Dry sauna, red light and a shower if you feel like it. Lock up and go.\",\n  f1:\"Sessions are capped at 6 people.\", f2:\"If you've never used a reformer, the iPad has starter sessions made for that.\", f3:\"Any question gets answered on WhatsApp there and then.\",\n  h2studio:\"The studio\", seestudio:\"See the whole studio\",\n  m1:\"Fabric\", d1:\"Linen curtains in the entrance arch.\", m2:\"Wood\", d2:\"Six reformers, one each.\", m3:\"Light\", d3:\"Red light room.\",\n  i1:\"6 reformers\", i2:\"Dry sauna\", i3:\"Red light\", i4:\"Changing room\", i5:\"Towels\",\n  h2hours:\"Every hour has its light\", phours:\"The room changes through the day. Pick your hour by how you want to feel on the way out.\",\n  t1:\"morning light\", t2:\"high light\", t3:\"low light\",\n  tn1:\"Before work.\", tn2:\"The quietest hour of the day.\", tn3:\"To close the day.\",\n  h2quiz:\"How are you arriving today?\",\n  q1:\"Back is stiff.\", q1b:\"We open the booking with a mobility session and low load.\",\n  q2:\"No energy.\", q2b:\"High-light slot and a short class. You leave awake, not wrecked.\",\n  q3:\"I want to move better.\", q3b:\"Start with the intro session and move up whenever you want.\",\n  h2price:\"Prices\", seeprice:\"See all rates\", reco:\"Recommended\",\n  p1:\"Single class\", p1b:\"One 50-minute session, whenever you feel like it.\",\n  p2:\"Monthly pass\", p2b:\"Number of classes per month, terms and lock-in still undefined.\",\n  p3:\"10-class pass\", p3b:\"Ten sessions, expiry to be confirmed.\",\n  pfine:\"The trial class is free and doesn't oblige you to buy anything afterwards.\",\n  h2faq:\"What holds<br>a booking back\", pfaq:\"If you still have a question after this, write to us on WhatsApp.\",\n  fq1:\"What if I've never done pilates?\", fa1:\"There are starter sessions made for a first day. The iPad walks you through position and load.\",\n  fq2:\"Is there a teacher in the room?\", fa2:\"The model is semi-autonomous: the screen leads the class. A teacher on the floor is still to be confirmed. [TO CONFIRM]\",\n  fq3:\"Do I have to buy anything after the trial?\", fa3:\"No. The trial is free and carries no purchase.\",\n  fq4:\"What do I wear?\", fa4:\"Comfortable clothes and grip socks. Towels are on the studio. [TO CONFIRM]\",\n  fq5:\"How long is it?\", fa5:\"The session is 50 minutes. With changing room and sauna, count an hour and a quarter.\",\n  fq6:\"Can I go at my own pace?\", fa6:\"Yes. You pick class and level on the iPad, and you can drop the load whenever you want.\",\n  fq7:\"Can I cancel?\", fa7:\"From the app, up to the cut-off we set before class. Exact cut-off [TO CONFIRM]\",\n  h2where:\"Where we are\", waddr:\"Address\", wcome:\"Getting here\", wopen:\"Open in maps\",\n  h2social:\"What people say\", freefoot:\"Free trial\",\n  footfine:\"Santa Cruz de Tenerife · opening [TO CONFIRM]\",\n  wlkick:\"Opening list\", wltitle:\"Come in on day one.\",\n  wlbody:\"We'll write once, when the booking opens, with a slot held for your free trial class. Nothing else.\",\n  wlname:\"Name\", wlmail:\"Email\", wlphone:\"Phone\", wlsend:\"Join the opening list\",\n  wlfine:\"Three fields. No account, no newsletter.\",\n  bstitle:\"Your free trial class\", bstrust:\"50 minutes · no commitment · limited spots\", bshelp:\"Any doubt? WhatsApp us\"\n};\n\nclass Component extends DCLogic {\n  state = { lang: \"es\" };\n\n  constructor(props){\n    super(props);\n    this.stageRef = React.createRef();\n    this.dotRef = React.createRef();\n    this.haloRef = React.createRef();\n    this.haloLabelRef = React.createRef();\n    this.faqRef = React.createRef();\n    this.phraseRef = React.createRef();\n    this.pos = {x:-100,y:-100}; this.tgt = {x:-100,y:-100}; this.mode = null;\n    this.es = new Map();\n  }\n\n  componentDidMount(){\n    this.captureEs();\n    this.wireCursor();\n  }\n  componentDidUpdate(){ this.applyLang(); }\n\n  captureEs(){\n    const root = this.stageRef.current; if(!root) return;\n    root.querySelectorAll(\"[data-i18n]\").forEach(el => {\n      if(!this.es.has(el)) this.es.set(el, el.innerHTML);\n    });\n  }\n  applyLang(){\n    const root = this.stageRef.current; if(!root) return;\n    this.captureEs();\n    const en = this.state.lang === \"en\";\n    root.querySelectorAll(\"[data-i18n]\").forEach(el => {\n      const k = el.getAttribute(\"data-i18n\");\n      const es = this.es.get(el);\n      if(en && DICT[k]) el.innerHTML = DICT[k].replace(/\\n/g,\"<br>\");\n      else if(es != null) el.innerHTML = es;\n    });\n  }\n\n  wireCursor(){\n    const stage = this.stageRef.current;\n    if(!stage || this.props.liveCursor === false) return;\n    const dot = this.dotRef.current, halo = this.haloRef.current, label = this.haloLabelRef.current;\n    if(!dot || !halo) return;\n    const onMove = (e) => {\n      const r = stage.getBoundingClientRect();\n      const sx = r.width / stage.offsetWidth || 1;\n      this.tgt.x = (e.clientX - r.left) / sx;\n      this.tgt.y = (e.clientY - r.top) / sx;\n      const t = e.target.closest ? e.target.closest(\"[data-cur]\") : null;\n      const m = t ? t.getAttribute(\"data-cur\") : null;\n      if(m !== this.mode){\n        this.mode = m;\n        const set = (w,h,bg,rad,txt) => {\n          halo.style.width = w+\"px\"; halo.style.height = h+\"px\";\n          halo.style.margin = (-h/2)+\"px 0 0 \"+(-w/2)+\"px\";\n          halo.style.backgroundColor = bg; halo.style.borderRadius = rad;\n          label.textContent = txt || \"\"; label.style.opacity = txt ? \"1\" : \"0\";\n          label.style.fontSize = (m === \"cta\" ? 15 : 14) + \"px\";\n        };\n        if(m === \"link\") set(56,56,\"rgba(255,130,53,.15)\",\"999px\",\"\");\n        else if(m === \"photo\") set(96,96,\"rgba(255,241,230,.25)\",\"999px\",\"ver\");\n        else if(m === \"cta\") set(132,52,\"rgba(255,130,53,.22)\",\"999px\",\"reservar\");\n        else set(32,32,\"transparent\",\"999px\",\"\");\n      }\n    };\n    stage.addEventListener(\"mousemove\", onMove);\n    stage.addEventListener(\"mouseleave\", () => { this.tgt.x = -200; this.tgt.y = -200; });\n    const tick = () => {\n      this.pos.x += (this.tgt.x - this.pos.x) * 0.22;\n      this.pos.y += (this.tgt.y - this.pos.y) * 0.22;\n      dot.style.transform = \"translate(\"+this.tgt.x+\"px,\"+this.tgt.y+\"px)\";\n      halo.style.transform = \"translate(\"+this.pos.x+\"px,\"+this.pos.y+\"px)\";\n      this._raf = requestAnimationFrame(tick);\n    };\n    tick();\n  }\n  componentWillUnmount(){ if(this._raf) cancelAnimationFrame(this._raf); }\n\n  renderVals(){\n    return {\n      stageRef: this.stageRef, dotRef: this.dotRef, haloRef: this.haloRef,\n      haloLabelRef: this.haloLabelRef, faqRef: this.faqRef, phraseRef: this.phraseRef,\n      setEs: (e) => { this.setLang(e, \"es\"); },\n      setEn: (e) => { this.setLang(e, \"en\"); },\n      openWaitlist: () => { window.location.hash = \"#1c\"; },\n      toggleFaq: (e) => {\n        const row = e.currentTarget;\n        const ans = row.querySelector(\"[data-ans]\");\n        const plus = row.querySelector(\"[data-plus]\");\n        const open = ans.style.display !== \"none\";\n        ans.style.display = open ? \"none\" : \"block\";\n        plus.style.transform = open ? \"none\" : \"rotate(45deg)\";\n        plus.style.display = \"inline-block\";\n        row.style.background = open ? \"transparent\" : \"rgba(255,241,230,.5)\";\n      }\n    };\n  }\n\n  setLang(e, lang){\n    const wrap = e.currentTarget.parentElement;\n    [...wrap.children].forEach((b,i) => {\n      const on = (i === 0) === (lang === \"es\");\n      b.style.background = on ? \"#FF8235\" : \"transparent\";\n      b.style.color = on ? \"#3B1D0E\" : \"#7A5540\";\n      b.style.fontWeight = on ? \"500\" : \"400\";\n    });\n    this.setState({ lang });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
