# 1 · PORTADA
portada:
  titular: "Reformer Pilates on your *time*."
  subtitulo: "Your reformer, your class on screen and the studio to yourself. The first time, we show you everything."
  abrimos: "opening on"
  foto:
    imagen: "../../assets/portada.png"
    alt: "The SUNNA studio: reformers, curtains and warm light"

porQue:
  titulo: "Why SUNNA"
  razones:
    - titulo: "Open morning and afternoon"
      texto: "{horario}. No group timetable: you book the hour that suits you."
      # Con ajustes.yaml → horario: ampliado se muestra esto en su lugar.
      ampliado:
        titulo: "Open {horario}"
        texto: "With no reception desk and no group timetable, the studio opens far longer hours."
    - titulo: "Everything runs on its own"
      texto: "Book your reformer in the app and the door opens with your booking. No keys, no reception, no waiting."
    - titulo: "Your class, your pace"
      texto: "An iPad and headphones on every reformer: pick a class from 10 to 45 min and press play. For that hour, the reformer is yours."
  app:
    titulo: "Your key is the *app*"
    texto: "Book your reformer, pay and open the studio door with it. No app, no entry: download it before you come."
    proximamente: "Coming soon"
    appStore: "App Store"
    googlePlay: "Google Play"

explora:
  titulo: "Discover SUNNA"
  ver: "See"
  precios:
    texto: "Four monthly memberships, from €55 a month."

primeraSesion:
  titulo: "Your first session is *free*."
  texto: "45 minutes with us before you train on your own. It's required."
  incluyeTitulo: "What we do in those 45 minutes"
  incluye:
    - minutos: 20
      titulo: "The reformer"
      texto: "We show you the reformer and how to use it safely."
    - minutos: 10
      titulo: "The app"
      texto: "We set up the app with you: booking and cancelling."
    - minutos: 5
      titulo: "Getting in"
      texto: "We explain how to get into the studio with your phone."
    - minutos: 10
      titulo: "The iPad"
      texto: "We show you how to pick your class on the iPad."
  cierre: "That's it: from here on, you train on your own."
  reservarTitulo: "Book it"
  reservarTexto: "In the app, on the web or by messaging us on WhatsApp: your choice."
  web: "Book on the web"
  whatsapp: "Book on WhatsApp"
  whatsappMensaje: "Hi, I'd like to book my free first session at SUNNA Pilates."

# SOBRE NOSOTROS (página propia). Qué es SUNNA en datos cortos: lo leen también Google y
# los asistentes de IA (ChatGPT, Claude, Perplexity…). {direccion} y {horario} se rellenan solos.
sobreNosotros:
  titulo: "About *SUNNA*"
  texto: "SUNNA is a semi-autonomous Pilates Reformer studio in Santa Cruz de Tenerife: 6 reformers, one person per machine, video-guided classes on an iPad at each reformer and access with your phone."
  datosTitulo: "SUNNA at a glance"
  datos:
    - nombre: "What it is"
      valor: "A semi-autonomous Pilates Reformer studio, with an infrared sauna and a red light room."
    - nombre: "Where"
      valor: "{direccion}."
    - nombre: "Reformers"
      valor: "6 reformers, one person per machine."
    - nombre: "Classes"
      valor: "Video-guided on the iPad at each reformer: Full Body, Legs, Arms, Core, Mobility and Stretching, from 10 to 45 minutes."
    - nombre: "Languages"
      valor: "Spanish, English, German and French, with bluetooth headphones at each reformer."
    - nombre: "Opening hours"
      valor: "{horario}."
    - nombre: "Access"
      valor: "With your phone: the door opens with your booking. No keys, no reception."
    - nombre: "First session"
      valor: "Free: 45 minutes with the SUNNA team before you train on your own."
    - nombre: "Memberships"
      valor: "Four monthly memberships, from €55 a month."
    - nombre: "Safety"
      valor: "Only people with a booking can enter, with cameras, a help phone and WhatsApp."
    - nombre: "Minimum age"
      valor: "18 to train on your own."
  clavesTitulo: "How we do it"
  claves:
    - titulo: "You never start alone"
      texto: "Your first session is free and with us: we show you the reformer, the app, how to get in and how to choose your class."
    - titulo: "A guided class on your reformer"
      texto: "An iPad at every machine with classes from 10 to 45 min. The video guides you step by step and you can pause."
    - titulo: "You choose the time"
      texto: "Book in the app, no fixed group schedules. For that hour, the reformer is yours."
    - titulo: "No permanent instructor in the room"
      texto: "That's why the studio can open so many hours. At first there will always be someone from SUNNA; after that, only people with a booking can enter."
  # PENDIENTE (SUNNA): quién está detrás. Una entrada por persona; mientras esté vacío, no se ve.
  #   - nombre: "Nombre Apellido"
  #     cargo: "Fundadora · Instructora de Pilates certificada"
  #     texto: "Una o dos frases sobre su experiencia."
  #     enlace: "https://www.linkedin.com/in/..."
  equipoTitulo: "The team"
  equipo: []
  # PENDIENTE (SUNNA): años en el sector, de dónde nace SUNNA… Vacío = no se ve.
  # Párrafos separados por una línea en blanco.
  historiaTitulo: "Our story"
  historia: ""
  preguntasTitulo: "What people ask us most"
  preguntas:
    - pregunta: "Where can I do reformer Pilates in Santa Cruz de Tenerife?"
      respuesta: "At SUNNA, {direccion}. You book your reformer in the app and train with a class guided on screen, at your own pace."
    - pregunta: "Can I try reformer Pilates for free in Tenerife?"
      respuesta: "Yes. At SUNNA your first session is free: 45 minutes with us to show you the reformer, the app, how to get in and how to choose your class."
    - pregunta: "Are there reformer Pilates classes in English, German or French in Tenerife?"
      respuesta: "Yes. At SUNNA classes are in Spanish, English, German and French, with bluetooth headphones at each reformer. The largest catalogue is in English."
    - pregunta: "Do I need experience to do reformer Pilates?"
      respuesta: "No. The first session is designed for complete beginners, and the reformer's springs adjust to you."
    - pregunta: "How much does reformer Pilates cost at SUNNA?"
      respuesta: "There are four monthly memberships, from €55 a month. With Premium it works out from €3 per session."
    - pregunta: "When can I go?"
      respuesta: "{horario}. You book the time that suits you, with no group schedules."
  cierreTitulo: "Your first session is *free*."
  cierreTexto: "Book it and we'll show you everything."


# 3 · CÓMO FUNCIONA
comoFunciona:
  titulo: "How it works"
  pasos:
    - icono: "arco"
      titulo: "Come to your first session. It's free."
      texto: "45 minutes with us: we show you the reformer, the app, how to get in and how to choose your class. It's required before you train on your own."
    # Reservar y entrar van en un solo paso: los dos son «desde el móvil».
    - icono: "pantalla"
      titulo: "Book in the app and get in with your phone."
      texto: "Pick a day and time: for that hour, the reformer is yours. The door opens with your booking, no keys, no reception."
    - icono: "punto"
      titulo: "Choose your class and press play."
      texto: "On your reformer's iPad: full body, core, legs, mobility… from 10 to 45 minutes."
  notaFinal: "When you finish, leave your reformer ready for the next person."
  datos:
    reserva: "Each booking is a 1-hour block: up to 50 min of class + time to come in, set up and leave."
    cancelacion: "You book in advance and cancellation is free up to 2 hours before."
    horario:
      titulo: "Opening hours"
      fases:
        - fase: "inicial"
        - fase: "ampliado"
          texto: "Self-service access."
      # "Cómo se llena el día" (franjas de demanda) se quita hasta tener estadísticas reales.
      # El componente lo sigue admitiendo: basta con volver a añadir "franjas:" aquí.

