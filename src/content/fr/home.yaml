# 9 · PREGUNTAS FRECUENTES
faq:
  titulo: "Questions fréquentes"
  grupos:
    - titulo: "Commencer"
      preguntas:
        - pregunta: "Faut-il savoir faire du Pilates ?"
          respuesta: "Non. La première séance, gratuite et avec nous, est pensée pour celles et ceux qui partent de zéro."
        - pregunta: "Que se passe-t-il lors de la première séance ?"
          respuesta: "45 minutes pendant lesquelles on te montre le reformer, l'app, comment entrer au studio et comment choisir ton cours. Sans elle, impossible de s'entraîner en autonomie."
        - pregunta: "Et si j'oublie quelque chose ensuite ?"
          respuesta: "Passe quand quelqu'un de l'équipe est là et on revoit ça ensemble."
    - titulo: "Réserver et entrer"
      preguntas:
        - pregunta: "Comment je réserve ?"
          respuesta: "Dans l'app SUNNA (bsport). Tu choisis le jour, l'heure et le reformer."
        - pregunta: "Comment j'entre ?"
          respuesta: "Avec ton téléphone : la porte ne s'ouvre que si tu as une réservation à ce moment-là."
        - pregunta: "Puis-je annuler ?"
          respuesta: "Oui, sans frais si tu préviens à l'avance."
        - pregunta: "Quels sont vos horaires ?"
          respuesta: "Les premières semaines, 08:00–14:00 et 16:00–22:00, toujours avec quelqu'un de l'équipe. Ensuite, on élargira progressivement jusqu'à 05:00–23:00."
    - titulo: "Les cours"
      preguntas:
        - pregunta: "Comment se passe un cours ?"
          respuesta: "Tu choisis sur l'iPad de ton reformer et tu suis la vidéo. Il y a des cours de 10 à 45 minutes : full body, core, jambes, bras, mobilité et étirements."
        - pregunta: "En quelle langue ?"
          respuesta: "En espagnol, anglais, allemand et français. Le plus grand catalogue est en anglais, mais il y a aussi largement de quoi faire en espagnol."
        - pregunta: "Ai-je besoin d'écouteurs ?"
          respuesta: "Non. Chaque reformer a un casque bluetooth. Si tu préfères, apporte le tien."
        - pregunta: "Que dois-je apporter ?"
          respuesta: ""
    - titulo: "Sécurité et abonnement"
      preguntas:
        - pregunta: "Est-ce sûr de s'entraîner sans coach ?"
          respuesta: "Avant de t'entraîner en autonomie, tu fais la séance d'initiation. Seules les personnes qui ont réservé peuvent entrer, il y a des caméras dans le studio et tu as un téléphone d'assistance pour nous parler directement."
        - pregunta: "Puis-je résilier mon abonnement ?"
          respuesta: "Oui, avec un préavis de 10 jours."
        - pregunta: "Y a-t-il un âge minimum ?"
          respuesta: "18 ans pour s'entraîner seul·e. Les mineurs à partir de 16 ans, accompagnés d'un adulte."

