# 6 · ¿Y SI…?
dudas:
  titulo: "Et si… ?"
  items:
    - pregunta: "Jamais fait de Pilates ?"
      respuesta: "C'est justement le but de la première séance."
    - pregunta: "Et si je suis perdu·e pendant le cours ?"
      respuesta: "La vidéo te guide pas à pas et tu peux mettre en pause."
    - pregunta: "Serai-je seul·e au studio ?"
      respuesta: "Au début, il y aura toujours quelqu'un de SUNNA. Ensuite, seules les personnes qui ont réservé peuvent entrer, avec caméras et téléphone d'assistance."
    - pregunta: "Toujours en retard ?"
      respuesta: "Ici, pas de « retard » : ton cours commence quand tu appuies sur play."

