      - "Prioridad para reservar en la apertura e invitación al evento privado de inauguración."
      - "Reconocimiento como miembro fundador y acceso anticipado a novedades, talleres y eventos."
    pack:
      titulo: "Pack de bienvenida"
      texto: "Calcetines, tote bag, pegatinas y algún detalle más."
    plazas: "plazas libres de"

