# 9 · PREGUNTAS FRECUENTES (acordeón)
# Una pregunta con la respuesta vacía ("") no se muestra en la web.
faq:
  titulo: "Preguntas frecuentes"
  contacto:
    titulo: "¿Aún tienes preguntas?"
    texto: "Escríbenos y te respondemos encantados."
  grupos:
    - titulo: "Empezar"
      preguntas:
        - pregunta: "¿Tengo que saber Pilates?"
          respuesta: "No. La primera sesión, gratis y con nosotros, está pensada para quien empieza de cero."
        - pregunta: "¿Qué pasa en la primera sesión?"
          respuesta: "45 minutos en los que te enseñamos el reformer, la app, cómo entrar al estudio y cómo elegir clase. Sin ella no se puede entrenar por libre."
        - pregunta: "¿Y si después se me olvida algo?"
          respuesta: "Escríbenos por WhatsApp o ven cuando haya alguien del equipo y lo repasamos."
    - titulo: "Reservar y entrar"
      preguntas:
        - pregunta: "¿Cómo reservo?"
          respuesta: "Desde la app de SUNNA (bsport). Eliges día, hora y reformer."
        - pregunta: "¿Cómo entro?"
          respuesta: "Con el móvil: la puerta se abre solo si tienes reserva en ese momento."
        # PENDIENTE: plazo de cancelación (con bsport).
        - pregunta: "¿Puedo cancelar?"
          respuesta: "Sí, sin coste si avisas con antelación."
        - pregunta: "¿Qué horario tenéis?"
          respuesta: "Las primeras semanas, 08:00–14:00 y 16:00–22:00, siempre con alguien del equipo. Después iremos ampliando hasta 05:00–23:00."
    - titulo: "Las clases"
      preguntas:
        - pregunta: "¿Cómo es una clase?"
          respuesta: "Eliges en el iPad de tu reformer y sigues el vídeo. Hay clases de 10 a 45 minutos: full body, core, pierna, brazo, movilidad y estiramientos."
        - pregunta: "¿En qué idioma?"
          respuesta: "En castellano, inglés, alemán y francés. El catálogo más grande es en inglés, pero hay clases de sobra en castellano."
        - pregunta: "¿Necesito auriculares?"
          respuesta: "No. Cada reformer tiene cascos de diadema bluetooth. Si lo prefieres, trae los tuyos."
        # PENDIENTE: qué hay que llevar.
        - pregunta: "¿Qué tengo que llevar?"
          respuesta: ""
    - titulo: "Seguridad y membresía"
      preguntas:
        - pregunta: "¿Es seguro entrenar sin monitor?"
          respuesta: "Antes de entrenar por tu cuenta haces la sesión de iniciación. Solo entra quien ha reservado, hay cámaras en el estudio y tienes un teléfono de ayuda y WhatsApp para hablar directamente con nosotros."
        # PENDIENTE: confirmar plazo de baja y si se puede pausar la membresía.
        - pregunta: "¿Puedo darme de baja?"
          respuesta: "Sí, avisando con 10 días de antelación."
        # PENDIENTE: confirmar edad con acompañante (14 o 16).
        - pregunta: "¿Hay edad mínima?"
          respuesta: "18 años para entrenar solo/a. Menores, acompañados de un adulto a partir de 16 años."

